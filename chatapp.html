<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .chat-container {
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 350px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f7fb;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .contact-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .contact-item.active {
            background: rgba(255,255,255,0.2);
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        .search-box {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            width: 100%;
        }

        .search-box::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            max-width: 300px;
            z-index: 1000;
        }

        .emoji-picker.active {
            display: block;
            animation: scaleIn 0.2s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .emoji {
            font-size: 24px;
            cursor: pointer;
            display: inline-block;
            padding: 5px;
            transition: transform 0.2s;
        }

        .emoji:hover {
            transform: scale(1.3);
        }

        .reaction-container {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .reaction {
            background: rgba(0,0,0,0.05);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            font-style: italic;
            color: #666;
        }

        .typing-indicator.active {
            display: block;
        }

        .online-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            margin-right: 5px;
        }

        .offline-status {
            background: #6b7280;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .reply-preview {
            background: rgba(0,0,0,0.05);
            padding: 8px 12px;
            border-left: 3px solid #667eea;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Profile Header -->
            <div class="p-6 border-b border-white border-opacity-20">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <img id="userAvatar" src="" alt="Avatar" class="w-12 h-12 rounded-full mr-3">
                        <div>
                            <div class="font-semibold" id="userName">User</div>
                            <div class="text-xs opacity-75" id="userEmail">email@example.com</div>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-white hover:bg-white hover:bg-opacity-20 p-2 rounded-full">
                        🚪
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="p-4">
                <input type="text" 
                       class="search-box" 
                       placeholder="🔍 Search users..." 
                       id="searchInput"
                       oninput="searchUsers(this.value)">
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-white border-opacity-20">
                <button class="flex-1 py-3 text-center tab-btn active" onclick="switchTab('chats')" id="chatsTab">
                    💬 Chats
                </button>
                <button class="flex-1 py-3 text-center tab-btn" onclick="switchTab('groups')" id="groupsTab">
                    👥 Groups
                </button>
                <button class="flex-1 py-3 text-center tab-btn" onclick="switchTab('ai')" id="aiTab">
                    🤖 AI
                </button>
            </div>

            <!-- Contacts List -->
            <div class="flex-1 overflow-y-auto scrollbar-thin" id="contactsList">
                <!-- Contacts will be loaded here -->
            </div>

            <!-- Add Contact/Group Button -->
            <div class="p-4 border-t border-white border-opacity-20">
                <button onclick="openNewChatModal()" 
                        class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 py-3 rounded-full font-semibold transition">
                    ➕ New Chat
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Chat Header -->
            <div class="bg-white p-4 shadow-sm flex items-center justify-between" id="chatHeader">
                <div class="flex items-center">
                    <img id="chatAvatar" src="" alt="" class="w-10 h-10 rounded-full mr-3">
                    <div>
                        <div class="font-semibold" id="chatName">Select a chat</div>
                        <div class="text-xs text-gray-500" id="chatStatus">-</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openProfileModal()" class="p-2 hover:bg-gray-100 rounded-full">
                        👤
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-container scrollbar-thin" id="messagesContainer">
                <div class="text-center text-gray-400 py-20">
                    Select a chat to start messaging
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                Someone is typing...
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div id="replyPreview" style="display: none;" class="reply-preview mb-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-xs">Replying to:</div>
                            <div id="replyText"></div>
                        </div>
                        <button onclick="cancelReply()" class="text-gray-500">✕</button>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleEmojiPicker()" class="text-2xl hover:scale-110 transition">
                        😊
                    </button>
                    <input type="text" 
                           id="messageInput"
                           placeholder="Type a message..."
                           class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-purple-500"
                           onkeypress="handleMessageKeyPress(event)">
                    <button onclick="sendMessage()" 
                            class="bg-purple-600 text-white p-3 rounded-full hover:bg-purple-700 transition">
                        ➤
                    </button>
                </div>
            </div>

            <!-- Emoji Picker -->
            <div class="emoji-picker" id="emojiPicker">
                <div class="grid grid-cols-6 gap-2">
                    <span class="emoji" onclick="insertEmoji('😊')">😊</span>
                    <span class="emoji" onclick="insertEmoji('😂')">😂</span>
                    <span class="emoji" onclick="insertEmoji('❤️')">❤️</span>
                    <span class="emoji" onclick="insertEmoji('👍')">👍</span>
                    <span class="emoji" onclick="insertEmoji('🎉')">🎉</span>
                    <span class="emoji" onclick="insertEmoji('😍')">😍</span>
                    <span class="emoji" onclick="insertEmoji('😢')">😢</span>
                    <span class="emoji" onclick="insertEmoji('😎')">😎</span>
                    <span class="emoji" onclick="insertEmoji('🔥')">🔥</span>
                    <span class="emoji" onclick="insertEmoji('✨')">✨</span>
                    <span class="emoji" onclick="insertEmoji('💯')">💯</span>
                    <span class="emoji" onclick="insertEmoji('🚀')">🚀</span>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div class="modal" id="newChatModal">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">New Chat</h2>
                <button onclick="closeNewChatModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    ×
                </button>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-semibold">Search by Email or Username</label>
                <input type="text" 
                       id="newChatSearch"
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-purple-500"
                       placeholder="Search..."
                       oninput="searchNewChat(this.value)">
            </div>
            <div id="searchResults" class="max-h-60 overflow-y-auto">
                <!-- Search results will appear here -->
            </div>
            <div class="mt-6">
                <button onclick="openCreateGroupModal()" 
                        class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Create Group Instead
                </button>
            </div>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div class="modal" id="createGroupModal">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Create Group</h2>
                <button onclick="closeCreateGroupModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    ×
                </button>
            </div>
            <form id="createGroupForm" onsubmit="createGroup(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2 font-semibold">Group Name</label>
                    <input type="text" 
                           required
                           id="groupName"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-purple-500"
                           placeholder="My Awesome Group">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2 font-semibold">Add Members (comma separated emails)</label>
                    <textarea 
                           required
                           id="groupMembers"
                           rows="3"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-purple-500"
                           placeholder="user1@email.com, user2@email.com"></textarea>
                </div>
                <button type="submit"
                        class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Create Group
                </button>
            </form>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">My Profile</h2>
                <button onclick="closeProfileModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    ×
                </button>
            </div>
            <div class="text-center mb-6">
                <img id="profileAvatar" src="" alt="Avatar" class="w-24 h-24 rounded-full mx-auto mb-4">
                <h3 class="text-xl font-semibold" id="profileName">Username</h3>
                <p class="text-gray-500" id="profileEmail">email@example.com</p>
            </div>
            <form id="updateProfileForm" onsubmit="updateProfile(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2 font-semibold">New Username</label>
                    <input type="text" 
                           id="newUsername"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-purple-500"
                           placeholder="Enter new username">
                </div>
                <button type="submit"
                        class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Update Profile
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://script.google.com/macros/s/AKfycbw1S7dDdkWPKWe8JI1u2OxXo7NnlW77aNT70W-DaYGsOzFx3pU8HQYI0OT056YULI6_Vg/exec'; // Replace with your deployed URL

        // Global variables
        let currentUser = null;
        let currentChat = null;
        let currentTab = 'chats';
        let allContacts = [];
        let allGroups = [];
        let messageRefreshInterval = null;
        let replyToMessage = null;

        // Initialize
        window.onload = function() {
            const userData = localStorage.getItem('chatAppUser');
            if(!userData) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = JSON.parse(userData);
            initializeApp();
        };

        async function initializeApp() {
            // Set user info
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').src = currentUser.profilePic;
            document.getElementById('profileAvatar').src = currentUser.profilePic;
            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('profileEmail').textContent = currentUser.email;

            // Load contacts
            await loadContacts();

            // Start updating last seen
            setInterval(() => updateLastSeen(), 30000); // Every 30 seconds
        }

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'bg-white', 'bg-opacity-20'));
            document.getElementById(tab + 'Tab').classList.add('active', 'bg-white', 'bg-opacity-20');

            if(tab === 'chats') {
                loadContacts();
            } else if(tab === 'groups') {
                loadGroups();
            } else if(tab === 'ai') {
                loadAIChat();
            }
        }

        // Load contacts
        async function loadContacts() {
            // For demo, we'll just show empty state
            // In production, you'd load recent chats from the database
            const contactsList = document.getElementById('contactsList');
            contactsList.innerHTML = `
                <div class="text-center py-10 text-white text-opacity-70">
                    <div class="text-4xl mb-2">💬</div>
                    <div>Start a new chat!</div>
                </div>
            `;
        }

        // Search users
        async function searchUsers(query) {
            if(!query || query.length < 2) {
                loadContacts();
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'searchUsers',
                        query: query,
                        currentUser: currentUser.email
                    })
                });

                const result = await response.json();
                if(result.success) {
                    displaySearchResults(result.data);
                }
            } catch(error) {
                console.error('Search error:', error);
            }
        }

        function displaySearchResults(users) {
            const contactsList = document.getElementById('contactsList');
            
            if(users.length === 0) {
                contactsList.innerHTML = `
                    <div class="text-center py-10 text-white text-opacity-70">
                        <div class="text-4xl mb-2">🔍</div>
                        <div>No users found</div>
                    </div>
                `;
                return;
            }

            contactsList.innerHTML = users.map(user => `
                <div class="contact-item" onclick='startChat(${JSON.stringify(user)})'>
                    <div class="flex items-center">
                        <img src="${user.profilePic}" alt="" class="w-12 h-12 rounded-full mr-3">
                        <div class="flex-1">
                            <div class="font-semibold">${user.username}</div>
                            <div class="text-sm opacity-75">${user.email}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Start chat
        function startChat(contact) {
            currentChat = {
                type: 'private',
                contact: contact
            };

            document.getElementById('chatAvatar').src = contact.profilePic;
            document.getElementById('chatName').textContent = contact.username;
            document.getElementById('chatStatus').textContent = contact.email;

            loadMessages();

            // Start auto-refresh
            if(messageRefreshInterval) {
                clearInterval(messageRefreshInterval);
            }
            messageRefreshInterval = setInterval(() => loadMessages(), 2000);
        }

        // Load messages
        async function loadMessages() {
            if(!currentChat) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getMessages',
                        user1: currentUser.email,
                        user2: currentChat.type === 'private' ? currentChat.contact.email : null,
                        chatId: currentChat.type === 'group' ? currentChat.groupId : null,
                        isGroupMessage: currentChat.type === 'group'
                    })
                });

                const result = await response.json();
                if(result.success) {
                    displayMessages(result.data);
                }
            } catch(error) {
                console.error('Load messages error:', error);
            }
        }

        // Display messages
        function displayMessages(messages) {
            const container = document.getElementById('messagesContainer');
            
            if(messages.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-20">
                        <div class="text-6xl mb-4">👋</div>
                        <div>No messages yet. Start the conversation!</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isSent = msg.senderId === currentUser.email;
                const reactions = msg.reactions || {};
                const hasReactions = Object.keys(reactions).length > 0;

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div>
                            ${!isSent ? `<div class="text-xs text-gray-500 mb-1">${msg.senderId}</div>` : ''}
                            ${msg.replyTo ? `
                                <div class="reply-preview text-xs mb-2">
                                    Replying to a message
                                </div>
                            ` : ''}
                            <div class="message-bubble">
                                ${msg.message}
                                <div class="text-xs mt-1 opacity-75">
                                    ${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                </div>
                            </div>
                            ${hasReactions ? `
                                <div class="reaction-container">
                                    ${Object.entries(reactions).map(([emoji, users]) => `
                                        <span class="reaction" onclick='toggleReaction("${msg.messageId}", "${emoji}")'>
                                            ${emoji} ${users.length}
                                        </span>
                                    `).join('')}
                                </div>
                            ` : ''}
                            <div class="flex gap-2 mt-2 text-xs">
                                <button onclick='addReactionToMessage("${msg.messageId}")' class="opacity-50 hover:opacity-100">
                                    React
                                </button>
                                <button onclick='replyToMsg(${JSON.stringify(msg)})' class="opacity-50 hover:opacity-100">
                                    Reply
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if(!message || !currentChat) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'sendMessage',
                        senderId: currentUser.email,
                        receiverId: currentChat.type === 'private' ? currentChat.contact.email : currentChat.groupId,
                        message: message,
                        isGroupMessage: currentChat.type === 'group',
                        replyTo: replyToMessage ? replyToMessage.messageId : null
                    })
                });

                const result = await response.json();
                if(result.success) {
                    input.value = '';
                    cancelReply();
                    loadMessages();
                }
            } catch(error) {
                console.error('Send message error:', error);
            }
        }

        function handleMessageKeyPress(event) {
            if(event.key === 'Enter') {
                sendMessage();
            }
        }

        // AI Chat
        function loadAIChat() {
            currentChat = {
                type: 'ai'
            };

            document.getElementById('chatAvatar').src = 'https://ui-avatars.com/api/?name=AI+Assistant&background=random';
            document.getElementById('chatName').textContent = 'AI Assistant';
            document.getElementById('chatStatus').textContent = 'Powered by Grok';

            const container = document.getElementById('messagesContainer');
            container.innerHTML = `
                <div class="text-center text-gray-400 py-20">
                    <div class="text-6xl mb-4">🤖</div>
                    <div>Ask me anything!</div>
                </div>
            `;

            if(messageRefreshInterval) {
                clearInterval(messageRefreshInterval);
            }
        }

        async function sendMessageToAI() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if(!message) return;

            // Show user message
            const container = document.getElementById('messagesContainer');
            container.innerHTML += `
                <div class="message sent">
                    <div class="message-bubble">
                        ${message}
                    </div>
                </div>
            `;

            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Show typing
            document.getElementById('typingIndicator').classList.add('active');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'chatWithAI',
                        message: message
                    })
                });

                const result = await response.json();
                document.getElementById('typingIndicator').classList.remove('active');

                if(result.success) {
                    container.innerHTML += `
                        <div class="message received">
                            <div class="message-bubble">
                                ${result.data.reply}
                            </div>
                        </div>
                    `;
                    container.scrollTop = container.scrollHeight;
                }
            } catch(error) {
                document.getElementById('typingIndicator').classList.remove('active');
                console.error('AI chat error:', error);
            }
        }

        // Groups
        async function loadGroups() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getGroups',
                        userEmail: currentUser.email
                    })
                });

                const result = await response.json();
                if(result.success) {
                    displayGroups(result.data);
                    allGroups = result.data;
                }
            } catch(error) {
                console.error('Load groups error:', error);
            }
        }

        function displayGroups(groups) {
            const contactsList = document.getElementById('contactsList');
            
            if(groups.length === 0) {
                contactsList.innerHTML = `
                    <div class="text-center py-10 text-white text-opacity-70">
                        <div class="text-4xl mb-2">👥</div>
                        <div>No groups yet</div>
                    </div>
                `;
                return;
            }

            contactsList.innerHTML = groups.map(group => `
                <div class="contact-item" onclick='openGroup(${JSON.stringify(group)})'>
                    <div class="flex items-center">
                        <img src="${group.groupIcon}" alt="" class="w-12 h-12 rounded-full mr-3">
                        <div class="flex-1">
                            <div class="font-semibold">${group.groupName}</div>
                            <div class="text-sm opacity-75">${group.members.length} members</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openGroup(group) {
            currentChat = {
                type: 'group',
                groupId: group.groupId,
                groupName: group.groupName,
                groupIcon: group.groupIcon
            };

            document.getElementById('chatAvatar').src = group.groupIcon;
            document.getElementById('chatName').textContent = group.groupName;
            document.getElementById('chatStatus').textContent = group.members.length + ' members';

            loadMessages();

            if(messageRefreshInterval) {
                clearInterval(messageRefreshInterval);
            }
            messageRefreshInterval = setInterval(() => loadMessages(), 2000);
        }

        async function createGroup(e) {
            e.preventDefault();
            const groupName = document.getElementById('groupName').value;
            const membersInput = document.getElementById('groupMembers').value;
            const members = membersInput.split(',').map(m => m.trim());
            members.push(currentUser.email); // Add creator

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'createGroup',
                        groupName: groupName,
                        members: members,
                        createdBy: currentUser.email
                    })
                });

                const result = await response.json();
                if(result.success) {
                    alert('Group created successfully!');
                    closeCreateGroupModal();
                    switchTab('groups');
                } else {
                    alert(result.message);
                }
            } catch(error) {
                console.error('Create group error:', error);
            }
        }

        // Reactions
        async function addReactionToMessage(messageId) {
            const emoji = prompt('Enter emoji (😊, ❤️, 👍, etc.):');
            if(!emoji) return;

            await toggleReaction(messageId, emoji);
        }

        async function toggleReaction(messageId, emoji) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'addReaction',
                        messageId: messageId,
                        emoji: emoji,
                        userId: currentUser.email
                    })
                });

                const result = await response.json();
                if(result.success) {
                    loadMessages();
                }
            } catch(error) {
                console.error('Reaction error:', error);
            }
        }

        // Reply
        function replyToMsg(msg) {
            replyToMessage = msg;
            document.getElementById('replyPreview').style.display = 'block';
            document.getElementById('replyText').textContent = msg.message.substring(0, 50) + '...';
            document.getElementById('messageInput').focus();
        }

        function cancelReply() {
            replyToMessage = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        // Emoji picker
        function toggleEmojiPicker() {
            document.getElementById('emojiPicker').classList.toggle('active');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
            toggleEmojiPicker();
        }

        // Modals
        function openNewChatModal() {
            document.getElementById('newChatModal').classList.add('active');
        }

        function closeNewChatModal() {
            document.getElementById('newChatModal').classList.remove('active');
        }

        function openCreateGroupModal() {
            closeNewChatModal();
            document.getElementById('createGroupModal').classList.add('active');
        }

        function closeCreateGroupModal() {
            document.getElementById('createGroupModal').classList.remove('active');
        }

        function openProfileModal() {
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        async function searchNewChat(query) {
            if(!query || query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'searchUsers',
                        query: query,
                        currentUser: currentUser.email
                    })
                });

                const result = await response.json();
                if(result.success) {
                    const container = document.getElementById('searchResults');
                    
                    if(result.data.length === 0) {
                        container.innerHTML = '<div class="text-center text-gray-500 py-4">No users found</div>';
                        return;
                    }

                    container.innerHTML = result.data.map(user => `
                        <div class="flex items-center p-3 hover:bg-gray-100 rounded cursor-pointer" onclick='selectNewChat(${JSON.stringify(user)})'>
                            <img src="${user.profilePic}" alt="" class="w-10 h-10 rounded-full mr-3">
                            <div>
                                <div class="font-semibold">${user.username}</div>
                                <div class="text-sm text-gray-500">${user.email}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch(error) {
                console.error('Search error:', error);
            }
        }

        function selectNewChat(user) {
            closeNewChatModal();
            switchTab('chats');
            startChat(user);
        }

        // Profile update
        async function updateProfile(e) {
            e.preventDefault();
            const newUsername = document.getElementById('newUsername').value;

            if(!newUsername) {
                alert('Please enter a new username');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateProfile',
                        email: currentUser.email,
                        username: newUsername
                    })
                });

                const result = await response.json();
                if(result.success) {
                    currentUser.username = newUsername;
                    localStorage.setItem('chatAppUser', JSON.stringify(currentUser));
                    document.getElementById('userName').textContent = newUsername;
                    document.getElementById('profileName').textContent = newUsername;
                    alert('Profile updated!');
                    closeProfileModal();
                } else {
                    alert(result.message);
                }
            } catch(error) {
                console.error('Update profile error:', error);
            }
        }

        // Last seen
        async function updateLastSeen() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateLastSeen',
                        email: currentUser.email
                    })
                });
            } catch(error) {
                console.error('Update last seen error:', error);
            }
        }

        // Logout
        function logout() {
            if(confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('chatAppUser');
                window.location.href = 'index.html';
            }
        }

        // Override sendMessage for AI
        const originalSendMessage = sendMessage;
        sendMessage = function() {
            if(currentChat && currentChat.type === 'ai') {
                sendMessageToAI();
            } else {
                originalSendMessage();
            }
        };

        // Close modal on outside click
        window.onclick = function(event) {
            if(event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        };

        // Cleanup on page unload
        window.onbeforeunload = function() {
            if(messageRefreshInterval) {
                clearInterval(messageRefreshInterval);
            }
        };
    </script>
</body>
</html>
